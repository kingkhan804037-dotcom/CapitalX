<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CapitalX - Create Account</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: url("blue-bg.jpeg") center/cover fixed no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .register-box {
      width: 100%;
      max-width: 430px;
      background: rgba(5, 25, 45, 0.94);
      border: 1px solid #f5b942;
      border-radius: 20px;
      padding: 35px 25px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    }

    h1 {
      text-align: center;
      color: #f5b942;
      margin-bottom: 8px;
      font-size: 36px;
    }

    .subtitle {
      text-align: center;
      color: white;
      margin-bottom: 25px;
    }

    label {
      display: block;
      color: #f5b942;
      margin: 14px 0 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      border: 1px solid #557080;
      background: #0c263a;
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #f5b942;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #f5b942;
      color: #061a2b;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-text {
      text-align: center;
      color: white;
      margin-top: 20px;
    }

    .login-text a {
      color: #f5b942;
      text-decoration: none;
      font-weight: bold;
    }
  .success-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 10, 25, 0.78);
    backdrop-filter: blur(5px);
    align-items: center;
    justify-content: center;
    z-index: 9999;
}

.success-popup {
    width: 360px;
    max-width: 85%;
    padding: 32px 25px;
    text-align: center;
    background: linear-gradient(145deg, #071b35, #0b2948);
    border: 1px solid #f5b942;
    border-radius: 18px;
    box-shadow: 0 0 35px rgba(245, 185, 66, 0.35);
}

.success-icon {
    width: 58px;
    height: 58px;
    margin: 0 auto 15px;
    border-radius: 50%;
    background: #f5b942;
    color: #071b35;
    font-size: 38px;
    font-weight: bold;
    line-height: 58px;
}

.success-popup h2 {
    margin: 8px 0;
    color: #f5b942;
    font-size: 25px;
}

.success-popup p {
    color: #d7e2ed;
    font-size: 14px;
    margin: 12px 0 24px;
}

.success-popup button {
    border: none;
    border-radius: 8px;
    padding: 13px 28px;
    background: #f5b942;
    color: #071b35;
    font-weight: bold;
    cursor: pointer;
}

.success-popup button:hover {
    background: #ffd76a;
}
  </style>
</head>

<body>

  <div class="register-box">

    <h1>CapitalX</h1>
    <p class="subtitle">Create Your Account</p>

    <form id="registerForm">

      <label>Full Name</label>
      <input type="text" placeholder="Enter your full name" required>

      <label>Mobile Number</label>
      <input type="tel" placeholder="Enter mobile number" required>

      <label>Email</label>
      <input type="email" placeholder="Enter email address" required>

      <label>Password</label>
      <input type="password" placeholder="Create password" required>

      <label>Confirm Password</label>
      <input type="password" placeholder="Confirm password" required>

      <button type="submit">CREATE ACCOUNT</button>

    </form>
    
    <div id="successPopup" class="success-overlay">
  <div class="success-popup">
    <div class="success-icon">✓</div>

    <h2>Account Created</h2>

    <p>Your CapitalX account has been created successfully.</p>

    <button onclick="goToLogin()">Continue to Login</button>
  </div>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", function(event) {
    event.preventDefault();

    document.getElementById("successPopup").style.display = "flex";
});

function goToLogin() {
    window.location.href = "login.html";
}
</script>

    <p class="login-text">
      Already have an account?
      <a href="login.html">LOGIN</a>
    </p>

  </div>

</body>
</html>
